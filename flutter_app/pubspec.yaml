name: rasoi_traditional_recipes
description: "Authentic traditional Indian recipe application with trilingual support (English, Hindi, Telugu), voice assistant, meal planner, ingredient substitutions, and shopping list."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
